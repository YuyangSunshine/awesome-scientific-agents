name: Suggest a paper
description: Recommend a paper or update a publication record.
title: '[Paper] '
body:
  - type: input
    id: title
    attributes:
      label: Paper title and year
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Primary source URL
      description: Publisher DOI, official proceedings, or preprint landing page.
    validations:
      required: true
  - type: dropdown
    id: main_section
    attributes:
      label: Main section
      options:
        - Surveys and Perspectives
        - Scientific Agents and Systems
        - Evaluation and Research Infrastructure
    validations:
      required: true
  - type: dropdown
    id: primary_function
    attributes:
      label: Primary function for a scientific system
      description: Select Not applicable unless the main section is Scientific Agents and Systems.
      options:
        - Not applicable
        - Action Planning
        - Observation Acquisition
        - Claim Assessment
        - Experience Reuse
    validations:
      required: true
  - type: checkboxes
    id: function_contributions
    attributes:
      label: Other functional contributions
      description: Select every additional function supported by the paper; there is no maximum.
      options:
        - label: Action Planning
        - label: Observation Acquisition
        - label: Claim Assessment
        - label: Experience Reuse
  - type: textarea
    id: relevance
    attributes:
      label: Relevance and version information
      description: Explain scientific relevance, publication status, supporting official evidence, and related existing IDs or corrections.
    validations:
      required: true
